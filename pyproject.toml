[project]
name = "hipersign_trading"
authors = [{ name = "Hipersign", email = "sales@hipersignerp.com" }]
description = "Hipersign Trading, Distribution & Import/Export ERP — workflows, dashboards, import and export shipments, CRM and print formats on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
